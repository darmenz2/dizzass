name: Original BM1368 startup address commands
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - 'AGENTS.md'
      - 'Makefile.am'
      - 'libbitmain/src/chip/chip1368.c'
      - 'libbitmain/src/chip/chip.c'
      - 'integration/bm1368_control.c'
      - 'reconstruction/support/crc5.c'
      - 'libbitmain/src/transport-dispatch.c'
      - 'libbitmain/src/aml/chip.c'
      - 'libbitmain/src/uart.c'
      - 'integration/bm1368_nonce.h'
      - 'integration/common_read_register_135.h'
      - 'integration/transport_dispatch_135.h'
      - 'integration/bm1368_control.h'
      - 'include/xminer/recovery/chip1398.h'
      - 'include/xminer/recovery/aml_chip.h'
      - 'include/xminer/recovery/uart.h'
      - 'include/xminer/recovery/pll.h'
      - 'include/xminer/recovery/reg_cache.h'
      - 'src/backend/base.c'
      - 'integration/backend_cold_135.h'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-ticket-mask/STATIC_CONTRACT.md'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-ticket-mask/static-witness.json'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-init/evidence/constructor-proof.json'
      - 'integration/bm1368_address_commands_135.h'
      - 'reference/cgminer.vendor.elf'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-address-commands/**'
      - '.github/workflows/bm1368-address-commands-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-commands-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual address commands and existing transport composition
        run: make -C research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-address-commands CC=${{ matrix.cc }} test sanitize
      - name: Compare original bytes as data only
        run: |
          python -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-address-commands/verify_evidence.py --cgminer reference/cgminer.vendor.elf
          python -O -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-address-commands/verify_evidence.py
