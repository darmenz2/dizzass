# On the combined candidate, run the SAME stage tests against TRACKED sources.
# Original feature refs retain their historical standalone workflow unchanged.
name: Captured RX submit integration
on:
  pull_request:
    paths:
      - 'integration/native_jobs.c'
      - 'integration/native_submit.h'
      - 'integration/native/early_rx.*'
      - 'integration/review/rx_submit/**'
      - '.github/workflows/rx-submit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-source:
    uses: ./.github/workflows/combined-rx.yml
    with:
      groups: rx_submit
