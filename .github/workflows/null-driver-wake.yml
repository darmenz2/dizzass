name: R-15 neutralized driver wake
on:
  pull_request:
    branches: [review/queued-driver-wake-20260930]
    paths: ['cgminer.c', 'integration/review/null_driver/**', '.r15-source.patch', '.github/workflows/null-driver-wake.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'darmenz2/dizzass' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      head: ${{ steps.apply.outputs.head }}
    steps:
      - name: Apply the exact prepared fix on this task branch only
        id: apply
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r15-source'
          root.mkdir();os.chdir(root)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          git('init','-q');git('remote','add','origin','https://github.com/darmenz2/dizzass.git')
          head=os.environ['HEAD'];base='87f69b3b7513fa89eaf876a85fcf7ac88fa9c428'
          git('-c','gc.auto=0','-c','maintenance.auto=false','fetch','--depth=2','--no-tags','origin',head,base)
          git('checkout','-q','--detach',head)
          if git('rev-parse','HEAD')!=head:raise RuntimeError('wrong source')
          packed=pathlib.Path('.r15-source.patch')
          if packed.exists():
              branch='review/null-driver-wake-20260930'
              if os.environ['BRANCH']!=branch or git('rev-parse','HEAD^')!=base:
                  raise RuntimeError('not exact task bootstrap')
              raw=packed.read_bytes()
              if hashlib.sha256(raw).hexdigest()!='70ef6e229138e1391b9f2c9aed226caa20212f7bc8dacf0f712f43adef3f8094':raise RuntimeError('patch mismatch')
              subprocess.run(['git','apply','--index','-'],input=raw,check=True)
              git('rm','--',str(packed))
              expected=json.loads('{"cgminer.c":"34ac6cf0274153fea47dfe752c9ebc2e1a0bfa7f","integration/review/combined_rx/manifest.json":"79658c47ebf45e77ce4a5f7abee6e910e98ee3d4","integration/review/driver_wake/test_runner.py":"c932d20ab98fd8802fa1d7aec8710697c8b5b588","integration/review/null_driver/.gitignore":"c18dd8d83ceed1806b50b0aaa46beb7e335fff13","integration/review/null_driver/README_RU.md":"a758b55ec3bb4407f7ece30137f46be10e91248c","integration/review/null_driver/input_revisions.json":"d821d2b1314756c41f765df95779fc2224bd566c","integration/review/null_driver/run.py":"5786a0474e9938d0130a4ab4a6f84af94b9426f5","integration/review/null_driver/suite.mk":"a7821a78a1f56846d45a2a1e45bae6c470d90b14","integration/review/null_driver/test.c":"c9cee737b61f749043f2cff9982b55ea6648caf4","integration/review/null_driver/test_runner.py":"3e535831e207fa56f3b7119abeb5f6e58c15a93b"}')
              allowed=set(expected)|{'.github/workflows/null-driver-wake.yml'}
              if set(git('diff','--cached','--name-only',base).splitlines())!=allowed:raise RuntimeError('path mismatch')
              for path,blob in expected.items():
                  if git('rev-parse',':'+path)!=blob:raise RuntimeError('wrong blob '+path)
              if git('rev-parse',':.github/workflows/null-driver-wake.yml')!=git('rev-parse',head+':.github/workflows/null-driver-wake.yml'):
                  raise RuntimeError('self-modifying workflow forbidden')
              git('-c','user.name=ChatGPT task builder','-c','user.email=task-builder@users.noreply.github.com','commit','-qm','Clear neutralized queued driver wake with actual-core regression')
              if git('ls-remote','origin','refs/heads/'+branch).split()[0]!=head:raise RuntimeError('branch moved')
              ask=root/'.git'/'r15-askpass'
              ask.write_text('#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *) echo "$GH_TOKEN";; esac\n');ask.chmod(0o700)
              try:
                  subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True,env=dict(os.environ,GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0',GIT_TRACE='0',GIT_CURL_VERBOSE='0'))
              finally:ask.unlink()
              head=git('rev-parse','HEAD')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('head='+head+'\n')
          print('TEST_SOURCE_HEAD='+head);print('TEST_SOURCE_TREE='+git('rev-parse','HEAD^{tree}'))
  verify:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-17]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fresh read-only checkout of the applied source
        env:
          HEAD: ${{ needs.source.outputs.head }}
        run: |
          set -eu
          root="$RUNNER_TEMP/r15-$GITHUB_RUN_ID-${{ matrix.cc }}-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --no-tags origin "$HEAD"
          git checkout -q --detach "$HEAD"; test "$(git rev-parse HEAD)" = "$HEAD"
          test ! -e .r15-source.patch
          echo "SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Host-only Icarus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev '${{ matrix.cc }}'
      - name: Native driver cleanup and all previous tests and controls
        run: |
          set -eu; cd "$SOURCE_ROOT"
          python3 -B integration/review/null_driver/test_runner.py
          python3 -B -O integration/review/null_driver/test_runner.py
          python3 -B integration/review/driver_wake/test_runner.py
          python3 -B -O integration/review/driver_wake/test_runner.py
          python3 -B integration/review/queue_stop/test_runner.py
          python3 -B integration/review/null_driver/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r15-ci-normal --mutants
      - name: Mandatory sanitizer health and identical full test set
        run: |
          set -eu; cd "$SOURCE_ROOT"
          python3 -B integration/review/null_driver/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r15-ci-sanitized --sanitize
      - name: Keep complete logs and source receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r15-${{ matrix.cc }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_ROOT }}/build/r15-ci-*/results.json
            ${{ env.SOURCE_ROOT }}/build/r15-ci-*/logs/
            ${{ env.SOURCE_ROOT }}/build/r15-ci-*/compile-records/
          retention-days: 7
