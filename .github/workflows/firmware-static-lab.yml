name: Firmware static lab

on:
  pull_request:
    paths:
      - 'tools/firmware_lab/**'
      - 'research/vnishnet-t21-aml-nand-1.3.5/**'
      - '.github/workflows/firmware-static-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-pinned static analysis packages
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/firmware_lab/requirements.lock
      - name: Run every lab test without skips
        working-directory: tools/firmware_lab
        run: |
          python -B - <<'PY'
          import unittest
          import capstone
          from elftools.elf.elffile import ELFFile
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 49 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Reproduce bounded entry slice from existing reference data
        run: |
          python -B tools/firmware_lab/scripts/disassemble_slice.py reference/cgminer.vendor.elf --start 0x1012c --end 0x1016c --mode arm --out "$RUNNER_TEMP/dizzass-entry"
          cmp "$RUNNER_TEMP/dizzass-entry/slice.asm" research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/entry-arm/slice.asm
          cmp "$RUNNER_TEMP/dizzass-entry/receipt.json" research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/entry-arm/receipt.json
      - name: Reproduce cgminer metadata and bounded startup slices
        run: |
          python -B tools/firmware_lab/scripts/index_arm_elf.py reference/cgminer.vendor.elf --out "$RUNNER_TEMP/dizzass-cgminer-index"
          python -B tools/firmware_lab/scripts/disassemble_plan.py reference/cgminer.vendor.elf --plan research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/startup/cgminer-plan.json --out "$RUNNER_TEMP/dizzass-cgminer-slices"
          diff -r "$RUNNER_TEMP/dizzass-cgminer-index" research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/startup/cgminer-index
          diff -r "$RUNNER_TEMP/dizzass-cgminer-slices" research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/startup/cgminer-slices
      - name: Verify bounded hwscan dispatch evidence without firmware execution
        run: python -B research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/hwscan-dispatch/verify_evidence.py
      - name: Verify hwscan normal-return status evidence as data
        run: |
          python -B research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/hwscan-exit-status/verify_evidence.py
          python -B -m unittest discover -s research/vnishnet-t21-aml-nand-1.3.5/20-disassembly/hwscan-exit-status/tests -v
