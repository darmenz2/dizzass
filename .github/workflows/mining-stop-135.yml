name: Check original 1.3.5 mining stop and reset
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/base.c
      - src/backend/volt-ctrl.c
      - src/frontend/rescue.c
      - integration/*135.h
      - integration/mining-stop-135.mk
      - integration/evidence/mining_stop_135.json
      - integration/evidence/voltage_stop_135.json
      - integration/tests/*mining*135*
      - integration/tests/check_voltage_stop_evidence_135.py
      - tools/arm32*.py
      - tools/elf32.py
      - reference/cgminer.vendor.elf
      - .github/workflows/mining-stop-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mining-stop135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mining135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-mining135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original mining stop, nested calls, provenance and negative controls
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/mining-stop-135.mk CC=${{ matrix.cc }} dizzass-mining135-original dizzass-mining135-test dizzass-mining135-negative
      - name: Native memory and undefined behavior
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/mining-stop-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-mining135-test
      - name: Previous child stops and pre-exit regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/voltage-stop-135.mk CC=${{ matrix.cc }} dizzass-voltage135-original dizzass-voltage135-test
          make -f integration/rescue-stop-135.mk CC=${{ matrix.cc }} dizzass-rescue135-original dizzass-rescue135-test
          make -f integration/exit-cleanup-135.mk CC=${{ matrix.cc }} dizzass-exit135-original dizzass-exit135-test
          make -f integration/stop-policy-135.mk CC=${{ matrix.cc }} dizzass-stop135-original dizzass-stop135-test
          make -f integration/monitor-handlers-135.mk CC=${{ matrix.cc }} dizzass-handlers135-original dizzass-handlers135-test
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} dizzass-general135-original dizzass-general135-test
      - name: Static analysis and immutable prefix
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_MINING_STOP_135 -Xanalyzer -analyzer-output=text src/backend/base.c
          python3 integration/tests/check_mining_stop_evidence_135.py
          python3 integration/tests/check_voltage_stop_evidence_135.py
          printf '%s\n' 'Offline 663cc caller; no preset switch worker, native T21 binding or physical stop proof.'
