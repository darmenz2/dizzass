name: Check original 1.3.5 constructor and peripheral bodies
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/base.c
      - integration/backend_cold_135.h
      - integration/backend_peripheral_135.h
      - integration/backend-cold-135.mk
      - integration/tests/*backend_cold*135*
      - integration/tests/*backend_peripheral*135*
      - integration/evidence/backend_cold_135.json
      - .github/workflows/backend-cold-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-cold135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cold135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-cold135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original constructor and nested peripheral bodies
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/backend-cold-135.mk CC=${{ matrix.cc }} dizzass-cold135-original dizzass-cold135-boundaries dizzass-cold135-test
      - name: Native projected objects and error paths with sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/backend-cold-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-cold135-test
      - name: Preserve existing resume and composed PSU regression
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/backend-resume-135.mk CC=${{ matrix.cc }} dizzass-resume135-original dizzass-resume135-test
          make -f integration/gpio-power-135.mk CC=${{ matrix.cc }} dizzass-gpio135-original dizzass-gpio135-composed dizzass-gpio135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -Xanalyzer -analyzer-output=text src/backend/base.c
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
          printf '%s\n' 'Offline constructor and two callee bodies. 0x7409c runtime preparation remains untranslated. No physical startup or slot-drain proof.'
