name: Check hwscan profile and real PTY TX88

on:
  push:
    branches: [work/reconstruction]
    paths:
      - integration/**
      - .github/workflows/hwscan-io.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwscan-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hwscan-io:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact source without persisting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-hwscan-io-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev python3 clang
      - name: Build unchanged native core
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          autoreconf -fi
          ./configure --enable-icarus --disable-curses CFLAGS='-O1 -g -fcommon -ffunction-sections -fdata-sections'
          make -j2
          ./cgminer --version
      - name: Profile, system I/O and late replies through native cgminer
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/hwscan-io.mk dizzass-hwscan-io-test
      - name: Repeat with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/hwscan-io.mk SANITIZE=1 dizzass-hwscan-io-test
      - name: Repeat new objects with Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/hwscan-io.mk CC=clang DIZZASS_HWIO_DIR=build/hwscan-io-clang DIZZASS_ROUTE_DIR=build/hwio-route-clang DIZZASS_JOBS_DIR=build/hwio-jobs-clang DIZZASS_NONCE_DIR=build/hwio-nonce-clang dizzass-hwscan-io-test
      - name: Keep hardware and historical core outside production
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -s -f Makefile -f integration/native-check.mk dizzass-core-sources > "$RUNNER_TEMP/route-sources.txt"
          nm --defined-only cgminer > "$RUNNER_TEMP/route-symbols.txt"
          python3 integration/check_native_core.py --sources "$RUNNER_TEMP/route-sources.txt" --symbols "$RUNNER_TEMP/route-symbols.txt"
          printf '%s\n' 'Actual Linux PTY I/O, NOT a physical ASIC. No hardware scan, power, slot reuse, network submit or flash. ASan/UBSan and Clang do not cover all prebuilt libraries.'
