name: Check A-01 original throttling table reset
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - src/backend/throttling-reset.c
      - src/backend/base.c
      - integration/throttling_reset_135.h
      - integration/throttling-reset-135.mk
      - integration/evidence/throttling_reset_135.json
      - integration/tests/*throttling_reset*135*
      - tools/arm32_subset.py
      - tools/elf32.py
      - reference/cgminer.vendor.elf
      - .github/workflows/throttling-reset-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: throttling-reset135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reset135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/throttling-reset-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git fetch --depth=1 --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original reset, allocator provenance and nested mining stop
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/throttling-reset-135.mk CC=${{ matrix.cc }} dizzass-throttle135-original dizzass-throttle135-test dizzass-throttle135-negative
      - name: Native address and undefined behavior checks
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/throttling-reset-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-throttle135-test
      - name: Unchanged mining stop and pre-exit regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/mining-stop-135.mk CC=${{ matrix.cc }} dizzass-mining135-original dizzass-mining135-test
          make -f integration/exit-cleanup-135.mk CC=${{ matrix.cc }} dizzass-exit135-original dizzass-exit135-test
      - name: Static analysis and immutable dependencies
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_THROTTLING_RESET_135 -Xanalyzer -analyzer-output=text src/backend/throttling-reset.c
          python3 integration/tests/check_throttling_reset_evidence_135.py
          git diff --exit-code
