name: Task 2 recovery snapshot
on:
  push:
    branches: [repair/task-2-20260926]
    paths: [.github/workflows/task-2-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Export exact uploaded state without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/task-2-snapshot"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin b239c082f0f300b1171f2aa40c963a4a85c0924f
          test "$(git rev-parse FETCH_HEAD)" = b239c082f0f300b1171f2aa40c963a4a85c0924f
          git archive --format=tar.gz --output="$RUNNER_TEMP/dizzass-task-2-before.tar.gz" FETCH_HEAD
          sha256sum "$RUNNER_TEMP/dizzass-task-2-before.tar.gz"
      - name: Preserve private review snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dizzass-task-2-before
          path: ${{ runner.temp }}/dizzass-task-2-before.tar.gz
          if-no-files-found: error
          retention-days: 2
