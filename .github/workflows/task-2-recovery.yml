name: Task 2 isolated patch recovery
on:
  push:
    branches: [repair/task-2-20260926]
    paths: [.github/workflows/task-2-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch exact uploaded state without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/task-2-recovery"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin b239c082f0f300b1171f2aa40c963a4a85c0924f
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = b239c082f0f300b1171f2aa40c963a4a85c0924f
          test "$(git rev-parse HEAD^{tree})" = b1b3021fc37c8e3afddd36053482a113eb87272b
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Apply exact reviewed source patch, leaving workflow writes to connector
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          test "$(git hash-object dizzass_transport_monitor_135.patch)" = 7411a37db97c49cc742ddae990b0c2d824711520
          git apply --check dizzass_transport_monitor_135.patch
          git apply --index --exclude='.github/workflows/*' dizzass_transport_monitor_135.patch
          git rm dizzass_transport_monitor_135.patch
          git diff --cached --check
          test "$(git write-tree)" = c3d68e47c63cd079f7dd49f00d4902b229665e67
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
      - name: Native GCC and Clang checks, with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for cc in gcc clang; do
            make -f integration/transport-monitor-135.mk CC="$cc" TRANSPORT135_DIR="build/task2-$cc-transport" dizzass-transport135-test
            make -f integration/transport-monitor-135.mk CC="$cc" SANITIZE=1 TRANSPORT135_DIR="build/task2-$cc-transport-san" dizzass-transport135-test
            make -f integration/thermal-completion-135.mk CC="$cc" COMPLETION135_DIR="build/task2-$cc-completion" dizzass-completion135-test
            make -f integration/thermal-completion-135.mk CC="$cc" SANITIZE=1 COMPLETION135_DIR="build/task2-$cc-completion-san" dizzass-completion135-test
          done
          clang --analyze -I. -std=c11 -DVN135_SENSOR_MONITOR_135 -DVN135_THERMAL_READER_135 -DVN135_BACKEND_SHUTDOWN_135 -Xanalyzer -analyzer-output=text src/backend/base.c src/backend/temp.c libbitmain/src/aml/i2c.c reconstruction/support/sensor_cleanup_135.c
      - name: Publish only the exact source candidate, without touching working or upstream refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          test "$(git write-tree)" = c3d68e47c63cd079f7dd49f00d4902b229665e67
          git diff --exit-code
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply pending 1.3.5 thermal completion and sensor transport sources'
          test "$(git rev-parse HEAD^)" = b239c082f0f300b1171f2aa40c963a4a85c0924f
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/repair/task-2-sources-20260926
          printf 'CANDIDATE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
