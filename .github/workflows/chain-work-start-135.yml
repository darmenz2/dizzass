name: Check B-10 original per-chain work start
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - src/backend/work-gen/chain-work-start.c
      - reconstruction/support/record_fifo.c
      - include/xminer/recovery/nonce_fifo.h
      - libbitmain/src/uart.c
      - include/xminer/recovery/uart.h
      - integration/chain_work_start_135.h
      - integration/backend_shutdown_135.h
      - integration/chain-work-start-135.mk
      - integration/CHAIN_WORK_START_135_RU.md
      - integration/evidence/chain_work_start_135.json
      - integration/tests/*chain_work_start*135*
      - tools/arm32*subset.py
      - tools/elf32.py
      - reference/cgminer.vendor.elf
      - .github/workflows/chain-work-start-135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chainstart135:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Original instructions, native and semantic mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/b10-logs
          git rev-parse HEAD | tee build/b10-logs/head.txt
          ${{ matrix.cc }} --version | tee build/b10-logs/compiler.txt
          make -f integration/chain-work-start-135.mk CC=${{ matrix.cc }} CHAIN_START_DIR=build/b10 all negative 2>&1 | tee build/b10-logs/new.log
      - name: ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          make -f integration/chain-work-start-135.mk CC=${{ matrix.cc }} CHAIN_START_DIR=build/b10 sanitize 2>&1 | tee build/b10-logs/sanitizers.log
      - name: Existing route, UART and FIFO regressions
        shell: bash
        run: |
          set -euo pipefail
          make -f integration/chain-work-start-135.mk CC=${{ matrix.cc }} CHAIN_START_DIR=build/b10 regressions 2>&1 | tee build/b10-logs/regressions.log
      - name: Static analysis
        if: matrix.cc == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          clang --analyze -I. -Iinclude -std=c11 -Wall -Wextra -Wpedantic -Xanalyzer -analyzer-output=text src/backend/work-gen/chain-work-start.c 2>&1 | tee build/b10-logs/analyzer.log
      - name: Save exact head logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-work-start-${{ matrix.cc }}-${{ github.run_id }}
          retention-days: 7
          path: |
            build/b10-logs/
            build/b10/negative/*.log
