name: Check native work adapters

on:
  push:
    branches: [work/reconstruction]
    paths:
      - integration/**
      - .github/workflows/native-nonce.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-nonce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-nonce:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact source without persisting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-nonce-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev python3 clang
      - name: Build real cgminer without the recovery core
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          autoreconf -fi
          ./configure --enable-icarus --disable-curses CFLAGS='-O1 -g -fcommon -ffunction-sections -fdata-sections'
          make -j2
          ./cgminer --version
      - name: Native work and SHA checks plus historical RX conformance
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-nonce.mk dizzass-native-nonce-test
      - name: Instrument adapter, included native core and RX test units
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-nonce.mk SANITIZE=1 dizzass-native-nonce-test
          printf '%s\n' 'ASan/UBSan cover the adapter, test TU including native cgminer.c, and RX objects. Other prebuilt upstream objects are not instrumented by this step.'
      - name: Sent-job registry and native work ownership
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-jobs.mk dizzass-native-jobs-test
      - name: Registry lifetime and concurrency with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-jobs.mk SANITIZE=1 dizzass-native-jobs-test
      - name: Native registry and harness compiled with Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-jobs.mk CC=clang DIZZASS_JOBS_DIR=build/native-jobs-clang DIZZASS_NONCE_DIR=build/native-nonce-clang dizzass-native-jobs-test
          printf '%s\n' 'Clang covers the registry, adapter, native core test TU and RX units. Other objects use the previous GCC native build.'
      - name: Native submit path into an isolated Stratum queue
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-submit.mk dizzass-native-submit-test
      - name: Native submit lifetime and stop barrier with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-submit.mk SANITIZE=1 dizzass-native-submit-test
      - name: Native submit adapter and harness with Clang
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -f Makefile -f integration/native-submit.mk CC=clang DIZZASS_SUBMIT_DIR=build/native-submit-clang DIZZASS_JOBS_DIR=build/native-jobs-clang DIZZASS_NONCE_DIR=build/native-nonce-clang dizzass-native-submit-test
      - name: Production boundary remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          make -s -f Makefile -f integration/native-check.mk dizzass-core-sources > "$RUNNER_TEMP/nonce-sources.txt"
          nm --defined-only cgminer > "$RUNNER_TEMP/nonce-core-symbols.txt"
          python3 integration/check_native_core.py --sources "$RUNNER_TEMP/nonce-sources.txt" --symbols "$RUNNER_TEMP/nonce-core-symbols.txt"
          printf '%s\n' 'Offline native adapter only. No registered T21 driver, hardware commands or live pool. Submission tests use an isolated native queue without a network consumer.'
