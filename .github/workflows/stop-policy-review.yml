name: Stop policy isolated review
on:
  push:
    branches: [repair/stop-policy-135-20260926]
    paths: [.github/workflows/stop-policy-review.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch exact published base without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/stop-policy-source"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin eeaf7a4270fb3befd7520efee3f028c95edacb9b
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = 2da2a5f97d6b3b553a648c0a1d75ddc07902fbeb
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Retrieve pinned private patch objects and verify complete bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          ids = [
              '2d77a0ad08689ed5d808b61c3e3eda2d2f94cb00',
              'a95a68095b9a15fdf07635222c83a4ec07810695',
              '86b55844e93fdeb355b9e031e5397bc819a8521f',
              '0b11e80a8e8e355d220529b3d0652c12c43da080',
              '675fe03a1449dc2167f10747a8851a76e2ebffd4',
              'f6f491454c94d70d76da603a7491e81ff8e736bb',
              'eefae02605fce9b76a027a25f082bf00845d7828',
              '29adbd9ad1d1302d819766689d1a1062c0214bdd',
              '879326e8525dcc3d46f0af834d94167749f588ab',
              '896ff070e98b898f5f11d35d5b842196b5bab65e',
              '8300cfb08d9596391ba4b1cab3d189392cb232d7',
              'b4934e1ee48ef54b8a69a34732f70da9053e4b7e',
          ]
          chunks = []
          for sha in ids:
              request = urllib.request.Request(
                  'https://api.github.com/repos/darmenz2/dizzass/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  obj = json.load(response)
              assert obj['encoding'] == 'base64' and obj['sha'] == sha
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          compressed = b''.join(chunks)
          assert len(compressed) == 25642
          assert hashlib.sha256(compressed).hexdigest() == '48543a94221b51d1dc13f424b4074a4aec6fef7bed5a5027e2ae470e80a6f8f1'
          patch = gzip.decompress(compressed)
          assert len(patch) == 82229
          assert hashlib.sha256(patch).hexdigest() == '25fe0904efdd2a7573a3433813fdbead9eb9bbd1f23c020d6607664e92d46eba'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'stop-policy-135.patch').write_bytes(patch)
          print('PATCH_BYTES_VERIFIED', len(patch))
          PY
      - name: Apply exact source candidate without workflow writes
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git apply --check "$RUNNER_TEMP/stop-policy-135.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/stop-policy-135.patch"
          git diff --cached --check
          test "$(git write-tree)" = ad041b03f1a516a89e514c4c2ac92e566524ab19
          python3 integration/tests/check_stop_policy_evidence_135.py
      - name: Original comparison native composition sanitizers and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for cc in gcc clang; do
            make -f integration/stop-policy-135.mk CC="$cc" STOP135_DIR="build/review-$cc" dizzass-stop135-original dizzass-stop135-test
            make -f integration/stop-policy-135.mk CC="$cc" SANITIZE=1 STOP135_DIR="build/review-$cc-san" dizzass-stop135-test
            python3 integration/tests/test_stop_policy_mutations_135.py --cc "$cc"
          done
          clang --analyze -I. -std=c11 -DVN135_GENERAL_MONITOR_135 -DVN135_MONITOR_HANDLERS_135 -DVN135_BACKEND_SHUTDOWN_135 -DVN135_STOP_POLICY_135 -Xanalyzer -analyzer-output=text src/backend/base.c
      - name: Publish verified source candidate without updating working refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git diff --exit-code
          test "$(git write-tree)" = ad041b03f1a516a89e514c4c2ac92e566524ab19
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Recover original stop policy and restart counter with terminal flow tests'
          test "$(git rev-parse HEAD^)" = eeaf7a4270fb3befd7520efee3f028c95edacb9b
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/repair/stop-policy-sources-135-20260926
          printf 'CANDIDATE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
