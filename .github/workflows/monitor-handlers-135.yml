name: Check original 1.3.5 internal monitor handlers
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/base.c
      - integration/*135.h
      - integration/monitor-handlers-135.mk
      - integration/tests/*monitor*135*
      - integration/evidence/monitor_handlers_135.json
      - tools/arm32*.py
      - tools/elf32.py
      - reference/cgminer.vendor.elf
      - .github/workflows/monitor-handlers-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-handlers135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handlers135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-handlers135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original four bodies, nested chain decision and native composition
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/monitor-handlers-135.mk CC=${{ matrix.cc }} dizzass-handlers135-original dizzass-handlers135-test
      - name: Native bounded memory and undefined behavior
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/monitor-handlers-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-handlers135-test
      - name: Unchanged general worker and previous recovery regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} dizzass-general135-original dizzass-general135-test
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-general135-test
          make -f integration/transport-monitor-135.mk CC=${{ matrix.cc }} dizzass-transport135-original dizzass-transport135-test
          make -f integration/thermal-completion-135.mk CC=${{ matrix.cc }} dizzass-completion135-original dizzass-completion135-route dizzass-completion135-test
          make -f integration/backend-resume-135.mk CC=${{ matrix.cc }} dizzass-resume135-original dizzass-resume135-test
      - name: Static analysis and production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_GENERAL_MONITOR_135 -DVN135_MONITOR_HANDLERS_135 -Xanalyzer -analyzer-output=text src/backend/base.c
          python3 integration/tests/check_monitor_handlers_evidence_135.py
          printf '%s\n' 'Bounded original handlers; no real threads, hardware reset, native T21 driver, new autotune or slot-limit change.'
