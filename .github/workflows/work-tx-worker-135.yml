name: Check B-04 original TX88 worker
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - src/backend/work-gen/work-tx-worker.c
      - integration/work_tx_worker_135.h
      - integration/work-tx-worker-135.mk
      - integration/WORK_TX_WORKER_135_RU.md
      - integration/evidence/work_tx_worker_135.json
      - integration/tests/*work_tx_worker*135*
      - integration/work_tx88.c
      - .github/workflows/work-tx-worker-135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tx135:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Original instructions, native checks and semantic mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/b04-logs
          git rev-parse HEAD | tee build/b04-logs/head.txt
          ${{ matrix.cc }} --version | tee build/b04-logs/compiler.txt
          make -f integration/work-tx-worker-135.mk CC=${{ matrix.cc }} TX_DIR=build/b04 all negative 2>&1 | tee build/b04-logs/new.log
      - name: ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          make -f integration/work-tx-worker-135.mk CC=${{ matrix.cc }} TX_DIR=build/b04 sanitize 2>&1 | tee build/b04-logs/sanitizers.log
      - name: Existing route and TX88 regressions
        shell: bash
        run: |
          set -euo pipefail
          make -f integration/work-tx-worker-135.mk CC=${{ matrix.cc }} TX_DIR=build/b04 regressions 2>&1 | tee build/b04-logs/regressions.log
      - name: Static analysis
        if: matrix.cc == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          clang --analyze -I. -Iinclude -std=c11 -Wall -Wextra -Wpedantic -Xanalyzer -analyzer-output=text src/backend/work-gen/work-tx-worker.c 2>&1 | tee build/b04-logs/analyzer.log
      - name: Existing nonce snapshot consumer
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.recovery CC=${{ matrix.cc }} build/libvn135_recovered.so build/test-work-nonce 2>&1 | tee build/b04-logs/nonce-build.log
          ./build/test-work-nonce 2>&1 | tee build/b04-logs/nonce-native.log
          python3 tests/test_stage7_differential.py prepare --library ./build/libvn135_recovered.so --tag b04-${{ matrix.cc }} 2>&1 | tee build/b04-logs/nonce-original.log
      - name: Save exact head logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-tx-worker-${{ matrix.cc }}-${{ github.run_id }}
          retention-days: 7
          path: |
            build/b04-logs/
            build/b04/negative/*.log
            build/stage7-prepare-b04-*-results.json
