# On the combined candidate, run the SAME stage tests against TRACKED sources.
# Original feature refs retain their historical standalone workflow unchanged.
name: Coordinated software I/O lifecycle
on:
  pull_request:
    paths:
      - 'integration/native/io_lifecycle.*'
      - 'integration/review/io_lifecycle/**'
      - 'integration/review/rx_owner/test.c'
      - '.github/workflows/io-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-source:
    uses: ./.github/workflows/combined-rx.yml
    with:
      groups: io_lifecycle
