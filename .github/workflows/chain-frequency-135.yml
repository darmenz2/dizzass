name: Check original 1.3.5 chain frequency application
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/chain-frequency.c
      - src/backend/frequency-worker.c
      - src/backend/base.c
      - integration/*135.h
      - integration/chain-frequency-135.mk
      - integration/tests/*chain_frequency*135*
      - integration/evidence/chain_frequency_135.json
      - tools/arm32*.py
      - reference/cgminer.vendor.elf
      - .github/workflows/chain-frequency-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chain-frequency135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chainfreq135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chain-frequency-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original chain procedure native composition and negative controls
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/chain-frequency-135.mk CC=${{ matrix.cc }} dizzass-chainfreq135-original dizzass-chainfreq135-test dizzass-chainfreq135-negative
      - name: Address and undefined behavior sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/chain-frequency-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-chainfreq135-test
      - name: Worker dispatcher and existing handler regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/frequency-worker-135.mk CC=${{ matrix.cc }} dizzass-worker135-original dizzass-worker135-test
          make -f integration/frequency-worker-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-worker135-test
          make -f integration/frequency-fall-135.mk CC=${{ matrix.cc }} dizzass-fall135-original dizzass-fall135-test
          make -f integration/monitor-handlers-135.mk CC=${{ matrix.cc }} dizzass-handlers135-original dizzass-handlers135-test
          make -f integration/mining-stop-135.mk CC=${{ matrix.cc }} dizzass-mining135-original dizzass-mining135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_CHAIN_FREQUENCY_135 -Xanalyzer -analyzer-output=text src/backend/chain-frequency.c
          python3 integration/tests/check_chain_frequency_evidence_135.py
          python3 integration/tests/check_frequency_worker_evidence_135.py
