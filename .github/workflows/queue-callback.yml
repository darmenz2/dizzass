name: R-12 native fill-queue callback
on:
  pull_request:
    paths:
      - 'integration/native/queue_callback.*'
      - 'integration/review/queue_callback/**'
      - '.github/workflows/queue-callback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-17]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read-only exact candidate checkout
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          root="$RUNNER_TEMP/r12-$GITHUB_RUN_ID-${{ matrix.cc }}-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --no-tags origin "$HEAD"
          git checkout -q --detach "$HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo "SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Host-only Icarus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev '${{ matrix.cc }}'
      - name: Real native fill_queue and unchanged current-source regressions
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 -B integration/review/queue_callback/test_runner.py
          python3 -B -O integration/review/queue_callback/test_runner.py
          python3 -B integration/review/queue_callback/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r12-ci-normal --mutants
      - name: Mandatory sanitizer health then the same application suites
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 -B integration/review/queue_callback/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r12-ci-sanitized --sanitize
      - name: Preserve reports and actual compiler inputs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r12-${{ matrix.cc }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_ROOT }}/build/r12-ci-*/results.json
            ${{ env.SOURCE_ROOT }}/build/r12-ci-*/logs/
            ${{ env.SOURCE_ROOT }}/build/r12-ci-*/compile-records/
          retention-days: 7
