name: Bounded early RX integration
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - 'integration/native_jobs.*'
      - 'integration/native/early_rx.*'
      - 'integration/review/early_rx/**'
      - '.github/workflows/early-rx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang-17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate and pinned dependencies without credentials
        env:
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          root="$RUNNER_TEMP/early-rx-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$REPO.git"
          git fetch --depth=1 --no-tags origin "$HEAD"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json,subprocess
          p='integration/review/early_rx/manifest.json'
          for sha in sorted({x['commit'] for x in json.load(open(p))['pending']}):
              if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha):
                  raise SystemExit('invalid dependency commit')
              subprocess.run(['git','fetch','--depth=1','--no-tags','origin',sha],check=True)
          PY
          echo "SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install host-only build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev
          if [ '${{ matrix.cc }}' = 'clang-17' ]; then sudo apt-get install -y clang-17; fi
      - name: Runner integrity, native integration and semantic controls
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 integration/review/early_rx/test_runner.py
          python3 -O integration/review/early_rx/test_runner.py
          python3 integration/review/early_rx/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/ci-normal --mutants
      - name: Required sanitizer health then unchanged application cases
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 integration/review/early_rx/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/ci-sanitized --sanitize
      - name: Preserve exact receipts and logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-rx-${{ matrix.cc }}
          path: |
            ${{ env.SOURCE_ROOT }}/build/ci-*/results.json
            ${{ env.SOURCE_ROOT }}/build/ci-*/logs/
          retention-days: 7
