# On the combined candidate, run the SAME stage tests against TRACKED sources.
# Original feature refs retain their historical standalone workflow unchanged.
name: Bounded early RX integration
on:
  pull_request:
    paths:
      - 'integration/native_jobs.*'
      - 'integration/native/early_rx.*'
      - 'integration/review/early_rx/**'
      - '.github/workflows/early-rx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-source:
    uses: ./.github/workflows/combined-rx.yml
    with:
      groups: early_rx
