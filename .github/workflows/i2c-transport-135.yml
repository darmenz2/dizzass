name: Check original 1.3.5 AML I2C block transport
on:
  push:
    branches: [work/reconstruction]
    paths:
      - libbitmain/src/i2c.c
      - libbitmain/src/aml/i2c.c
      - libbitmain/src/psu.c
      - integration/i2c*135*
      - integration/psu*135*.h
      - integration/tests/test_i2c_transport_135.*
      - integration/evidence/i2c_transport_135.json
      - .github/workflows/i2c-transport-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i2c135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  i2c135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact revision without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-i2c135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original open close retries and nested PSU exchange with GCC
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-transport-135.mk CC=gcc dizzass-i2c135-original dizzass-i2c135-test
      - name: Instrument native allocations and error paths
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-transport-135.mk CC=gcc SANITIZE=1 dizzass-i2c135-test
      - name: Repeat with Clang and static analysis
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-transport-135.mk CC=clang I2C135_DIR=build/i2c135-clang dizzass-i2c135-original dizzass-i2c135-test
          make -f integration/i2c-transport-135.mk CC=clang SANITIZE=1 I2C135_DIR=build/i2c135-clang-san dizzass-i2c135-test
          clang --analyze -I. -std=c11 libbitmain/src/i2c.c libbitmain/src/aml/i2c.c
      - name: Previous PSU exchange regression and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/psu-protocol-135.mk CC=gcc dizzass-psu135-original dizzass-psu135-test
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
          printf '%s\n' 'Original instruction slices and scripted syscall results; NOT physical I2C, PSU startup, voltage measurement or slot-drain proof.'
