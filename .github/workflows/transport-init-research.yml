name: Transport initializer research
on:
  pull_request:
    paths:
      - 'libbitmain/src/transport-dispatch.c'
      - 'integration/transport_initialize_135.h'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/transport-init/**'
      - '.github/workflows/transport-init-research.yml'
  workflow_dispatch:
jobs:
  host-static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static-analysis libraries
        run: |
          python -m pip install --only-binary=:all: capstone==5.0.6 pyelftools==0.32
      - name: Host decisions, semantic controls and static evidence
        run: |
          make -C research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/transport-init CC=${{ matrix.cc }} test sanitize
      - name: Regenerate cgminer evidence as data only
        run: |
          python -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/transport-init/verify_evidence.py --cgminer reference/cgminer.vendor.elf
          python -O -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/transport-init/verify_evidence.py
