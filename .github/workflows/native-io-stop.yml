name: R-16 native and managed I/O stop
on:
  pull_request:
    paths:
      - '.github/workflows/native-io-stop.yml'
      - 'integration/native/native_io_stop.*'
      - 'integration/review/native_io_stop/**'
      - 'integration/review/driver_wake/test.c'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-17]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate checkout
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          root="$RUNNER_TEMP/r16-$GITHUB_RUN_ID-${{ matrix.cc }}-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --no-tags origin "$HEAD"
          git checkout -q --detach "$HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo "SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install host-only Icarus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev '${{ matrix.cc }}'
      - name: Composed stop and all existing native regressions and controls
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 -B integration/review/native_io_stop/test_runner.py
          python3 -B -O integration/review/native_io_stop/test_runner.py
          python3 -B integration/review/native_io_stop/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r16-ci-normal --mutants
      - name: Mandatory sanitizer health and the same complete test set
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          python3 -B integration/review/native_io_stop/run.py --cc '${{ matrix.cc }}' --baseline icarus --out build/r16-ci-sanitized --sanitize
      - name: Preserve complete reports, inputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-${{ matrix.cc }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_ROOT }}/build/r16-ci-*/results.json
            ${{ env.SOURCE_ROOT }}/build/r16-ci-*/logs/
            ${{ env.SOURCE_ROOT }}/build/r16-ci-*/compile-records/
          retention-days: 7
