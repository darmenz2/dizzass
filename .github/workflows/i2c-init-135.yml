name: Check original 1.3.5 GPIO I2C initialization and routing
on:
  push:
    branches: [work/reconstruction]
    paths:
      - libbitmain/src/i2c.c
      - libbitmain/src/aml/i2c.c
      - libbitmain/src/aml/psu.c
      - integration/i2c_init_135.h
      - integration/i2c-init-135.mk
      - integration/tests/*i2c_init*135*
      - integration/evidence/i2c_init_135.json
      - .github/workflows/i2c-init-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i2c-init135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  init135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-init135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Compare original registration GPIO init and AML routing
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-init-135.mk CC=${{ matrix.cc }} dizzass-init135-original dizzass-init135-route dizzass-init135-test
      - name: Native memory and partial failures with sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-init-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-init135-test
      - name: Previous software I2C and block transport regression
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/i2c-soft-135.mk CC=${{ matrix.cc }} dizzass-soft135-original dizzass-soft135-test
          make -f integration/i2c-transport-135.mk CC=${{ matrix.cc }} dizzass-i2c135-original dizzass-i2c135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -Xanalyzer -analyzer-output=text libbitmain/src/i2c.c libbitmain/src/aml/i2c.c libbitmain/src/aml/psu.c
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
          printf '%s\n' 'Original instruction slices; OS and GPIO operations are scripted. No physical startup, voltage measurement or slot reuse proof.'
