name: Check original 1.3.5 transport dispatch and AML UART composition
on:
  push:
    branches: [work/reconstruction]
    paths:
      - libbitmain/src/transport-dispatch.c
      - libbitmain/src/aml/chip.c
      - libbitmain/src/uart.c
      - libbitmain/src/chip/chip1368-register-write.c
      - libbitmain/src/reg_cache.c
      - integration/transport_dispatch_135.h
      - integration/transport-dispatch-135.mk
      - integration/tests/*transport_dispatch*135*
      - integration/evidence/transport_dispatch_135.json
      - include/xminer/recovery/*.h
      - tools/arm32*.py
      - reference/cgminer.vendor.elf
      - .github/workflows/transport-dispatch-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-dispatch135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dispatch135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/transport-dispatch135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original dispatch platform binding and register AML UART cache composition
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          make -f integration/transport-dispatch-135.mk CC=${{ matrix.cc }} dizzass-dispatch135-original dizzass-dispatch135-test dizzass-dispatch135-negative
      - name: Address and undefined behavior sanitizers
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          make -f integration/transport-dispatch-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-dispatch135-test
      - name: Previous register and PLL regressions
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          make -f integration/bm1368-register-write-135.mk CC=${{ matrix.cc }} dizzass-reg1368-original dizzass-reg1368-test
          make -f integration/bm1368-frequency-135.mk CC=${{ matrix.cc }} dizzass-pll1368-original dizzass-pll1368-test
      - name: Historical AML UART comparisons and static analysis
        run: |
          set -eu
          cd "$SOURCE_ROOT"
          cp build/transport-dispatch135/libtransport.so build/libvn135_recovered.so
          python3 tests/test_stage5_aml_uart_differential.py
          python3 tests/test_stage5_uart_differential.py
          clang --analyze -I. -Iinclude -std=c11 -DVN135_TRANSPORT_DISPATCH_135 -Xanalyzer -analyzer-output=text libbitmain/src/transport-dispatch.c
          python3 integration/tests/check_transport_dispatch_evidence_135.py
