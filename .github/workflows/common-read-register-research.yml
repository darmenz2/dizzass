name: Common READ_REGISTER research
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - 'libbitmain/src/chip/chip.c'
      - 'integration/common_read_register_135.h'
      - 'AGENTS.md'
      - 'integration/bm1368_control.c'
      - 'integration/bm1368_control.h'
      - 'integration/transport_dispatch_135.h'
      - 'libbitmain/src/transport-dispatch.c'
      - 'libbitmain/src/aml/chip.c'
      - 'libbitmain/src/uart.c'
      - 'reconstruction/support/crc5.c'
      - 'include/xminer/recovery/chip1398.h'
      - 'include/xminer/recovery/aml_chip.h'
      - 'include/xminer/recovery/uart.h'
      - 'include/xminer/recovery/pll.h'
      - 'include/xminer/recovery/reg_cache.h'
      - 'integration/transport_initialize_135.h'
      - 'integration/bm1368_initialize_135.h'
      - 'integration/bm1368_nonce.h'
      - 'libbitmain/src/chip/chip1368.c'
      - 'reference/cgminer.vendor.elf'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/common-read-register/**'
      - '.github/workflows/common-read-register-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-read-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static decoding libraries
        run: |
          python -m pip install --only-binary=:all: capstone==5.0.6 pyelftools==0.32
      - name: Actual wrapper and unchanged helper composition
        run: |
          make -C research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/common-read-register CC=${{ matrix.cc }} test sanitize
      - name: Verify cgminer input as data only
        run: |
          python -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/common-read-register/verify_evidence.py --root . --cgminer reference/cgminer.vendor.elf
          python -O -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/common-read-register/verify_evidence.py --root .
