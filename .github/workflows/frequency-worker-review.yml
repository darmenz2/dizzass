name: Frequency worker isolated review
on:
  push:
    branches: [repair/frequency-worker-135-20260926]
    paths: [.github/workflows/frequency-worker-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Archive pinned source without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frequency-worker-review"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin b1ec979c801dc0736a1712763c838b6d9749de14
          test "$(git rev-parse FETCH_HEAD^{tree})" = f36a02add05abd98865e2c0a362233b5ad135556
          git archive --format=tar.gz --output="$RUNNER_TEMP/dizzass-frequency-fall-published.tar.gz" FETCH_HEAD
          sha256sum "$RUNNER_TEMP/dizzass-frequency-fall-published.tar.gz"
      - name: Preserve private source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dizzass-frequency-fall-published
          path: ${{ runner.temp }}/dizzass-frequency-fall-published.tar.gz
          if-no-files-found: error
          retention-days: 2
