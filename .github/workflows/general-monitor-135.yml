name: Check original 1.3.5 general monitor
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/base.c
      - libbitmain/src/fan_ctrl.c
      - reconstruction/support/pid_135.c
      - integration/*135.h
      - integration/general-monitor-135.mk
      - integration/tests/*general_monitor*135*
      - integration/evidence/general_monitor_135.json
      - tools/arm32*.py
      - .github/workflows/general-monitor-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: general-monitor135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  general135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-general135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Whole original worker and native composition
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} dizzass-general135-original dizzass-general135-test
      - name: Address and undefined-behavior sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-general135-test
      - name: Previous transport temperature shutdown and fan regression
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/transport-monitor-135.mk CC=${{ matrix.cc }} dizzass-transport135-original dizzass-transport135-test
          make -f integration/thermal-completion-135.mk CC=${{ matrix.cc }} dizzass-completion135-original dizzass-completion135-route dizzass-completion135-test
          make -f integration/backend-resume-135.mk CC=${{ matrix.cc }} dizzass-resume135-test
          make -f integration/fan-control-135.mk CC=${{ matrix.cc }} dizzass-fanctl135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_GENERAL_MONITOR_135 -Xanalyzer -analyzer-output=text src/backend/base.c
          python3 integration/tests/check_general_monitor_evidence_135.py
          printf '%s\n' 'Offline original worker. No hardware commands, live threads, physical stop proof or production T21 driver.'
