name: Exit cleanup isolated review
on:
  push:
    branches: [repair/exit-cleanup-135-20260926]
    paths: [.github/workflows/exit-cleanup-review.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch exact published base without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/exit-cleanup-source"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin 890a3ce41208024e8dad494b88dbada00c0f18f4
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = 8bb98a8e89f47e2b5a5d5198b91e2a0301af59c2
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Retrieve exact private patch objects and verify complete bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          ids = [
              '3d8c7f591eae1191b2863e19ae6dfa6b5f5a7415',
              '32cca47761cdce6daefd096224a190d69ccb1c3b',
              '125f963194752701b3b60d239fef5c431e35c7f5',
              '3efb878c41510f96052d93264794d4fce4769fce',
              'cf62a6006ac24a16ffe87ffde20557178b1a4a99',
              'ebdbbef0a5394a454374957162267fb71719334f',
              '8708e7596e98566fb1ad9a49312f826c740fb0ea',
              'aac111008b21bbcff298024373fc66e66a65b51e',
              '115c833a8df972bf6dba839d9d144503ef979f34',
              'b47ab43880075fe71af4a67363343d68ab72b760',
              'bc9030a4ce0d259e120e381c7682c0cca072248d',
          ]
          chunks = []
          for sha in ids:
              request = urllib.request.Request(
                  'https://api.github.com/repos/darmenz2/dizzass/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  obj = json.load(response)
              assert obj['encoding'] == 'base64' and obj['sha'] == sha
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == '39d6b975d6c105857a8d3413d385c141d0f36f05f011e4358428f809b9536d19'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '1bc27d4d1e2f085770751eee888aa36f9a44308878a39484f88c6ab746ae3b00'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'exit-cleanup-135.patch').write_bytes(patch)
          print('PATCH_BYTES_VERIFIED', len(patch))
          PY
      - name: Apply exact source candidate without workflow writes
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git apply --check "$RUNNER_TEMP/exit-cleanup-135.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/exit-cleanup-135.patch"
          git diff --cached --check
          test "$(git write-tree)" = 7abfcf96a1a8133447936060bfe320fdd4aa69b8
          python3 integration/tests/check_exit_cleanup_evidence_135.py
      - name: Original nested comparisons native composition negative controls and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for cc in gcc clang; do
            make -f integration/exit-cleanup-135.mk CC="$cc" EXIT135_DIR="build/review-$cc" dizzass-exit135-original dizzass-exit135-test dizzass-exit135-negative
            make -f integration/exit-cleanup-135.mk CC="$cc" SANITIZE=1 EXIT135_DIR="build/review-$cc-san" dizzass-exit135-test
          done
          clang --analyze -I. -std=c11 -DVN135_GENERAL_MONITOR_135 -DVN135_MONITOR_HANDLERS_135 -DVN135_BACKEND_SHUTDOWN_135 -DVN135_STOP_POLICY_135 -DVN135_EXIT_CLEANUP_135 -Xanalyzer -analyzer-output=text src/backend/base.c
      - name: Publish isolated verified source candidate without updating working refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          git diff --exit-code
          test "$(git write-tree)" = 7abfcf96a1a8133447936060bfe320fdd4aa69b8
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Recover original pre-exit cleanup and nested stop-policy evidence'
          test "$(git rev-parse HEAD^)" = 890a3ce41208024e8dad494b88dbada00c0f18f4
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/repair/exit-cleanup-sources-135-20260926
          printf 'CANDIDATE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
