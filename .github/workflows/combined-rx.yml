name: R-06 combined current RX stack
on:
  pull_request:
    branches: [main, work/reconstruction]
    paths:
      - 'integration/review/combined_rx/**'
      - 'integration/native_jobs.*'
      - 'integration/native_submit.h'
      - 'integration/native/*.c'
      - 'integration/native/*.h'
      - '.github/workflows/combined-rx.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      groups:
        type: string
        default: all
        required: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darmenz2/dizzass'
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-17]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R06_GROUPS: ${{ inputs.groups || 'all' }}
    steps:
      - name: Fetch the exact candidate only; no staged source dependencies
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          root="$RUNNER_TEMP/r06-${R06_GROUPS}-${{ matrix.cc }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --no-tags origin "$CANDIDATE"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          echo "R06_SOURCE=$root" >> "$GITHUB_ENV"
      - name: Host Icarus dependencies and explicit compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev libusb-1.0-0-dev libudev-dev zlib1g-dev ${{ matrix.cc }}
      - name: Current-source suites and original semantic controls
        run: |
          set -eu
          cd "$R06_SOURCE"
          python3 -B integration/review/combined_rx/run.py --cc '${{ matrix.cc }}' --baseline icarus --groups "$R06_GROUPS" --out build/r06-ci-normal --mutants
      - name: Required sanitizer health and identical application suites
        run: |
          set -eu
          cd "$R06_SOURCE"
          python3 -B integration/review/combined_rx/run.py --cc '${{ matrix.cc }}' --baseline icarus --groups "$R06_GROUPS" --out build/r06-ci-sanitized --sanitize
      - name: Preserve actual source inputs, logs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r06-${{ env.R06_GROUPS }}-${{ matrix.cc }}-${{ github.run_attempt }}
          path: |
            ${{ env.R06_SOURCE }}/build/r06-ci-*/results.json
            ${{ env.R06_SOURCE }}/build/r06-ci-*/logs/
            ${{ env.R06_SOURCE }}/build/r06-ci-*/compile-records/
          retention-days: 7
