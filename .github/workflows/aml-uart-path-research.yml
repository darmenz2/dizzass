name: AML UART pathname research

on:
  pull_request:
    paths:
      - 'libbitmain/src/aml/platform.c'
      - 'include/xminer/recovery/aml_platform.h'
      - 'src/backend/work-gen/chain-work-start.c'
      - 'integration/chain_work_start_135.h'
      - 'integration/backend_shutdown_135.h'
      - 'integration/gpio_power_135.h'
      - 'integration/thermal_routes_135.h'
      - 'integration/thermal_sensors_135.h'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/aml-uart-path/**'
      - '.github/workflows/aml-uart-path-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-pinned static analysis packages
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/firmware_lab/requirements.lock
      - name: Run actual tracked C host tests and sanitizers
        working-directory: research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/aml-uart-path
        run: |
          "${{ matrix.cc }}" --version
          make test sanitize CC="${{ matrix.cc }}"
      - name: Regenerate cgminer byte evidence without executing the reference
        run: python -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/aml-uart-path/verify_evidence.py --cgminer-reference reference/cgminer.vendor.elf
