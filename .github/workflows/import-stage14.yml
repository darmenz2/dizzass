name: Import verified Stage 14 archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VNish135_modular_cgminer_stage14.zip
      - imports/VNish135_modular_cgminer_stage14.zip

permissions:
  contents: write

concurrency:
  group: dizzass-stage14-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify, extract and commit the exact archive
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = darmenz2/dizzass
          test "$GITHUB_REF_NAME" = main
          root="$RUNNER_TEMP/dizzass-stage14-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$root"
          cd "$root"
          git init -q
          git config user.name 'dizzass import'
          git config user.email '93091111+darmenz2@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          origin_git() { git -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          origin_git fetch --no-tags origin main
          git checkout -q -B main FETCH_HEAD
          archive=imports/VNish135_modular_cgminer_stage14.zip
          if ! test -f "$archive"; then
            archive=VNish135_modular_cgminer_stage14.zip
          fi
          test -f "$archive"
          python3 migration/import_stage14.py "$archive" --root "$root"
          export STAGE14_PATH_LIST="$RUNNER_TEMP/stage14-paths-$GITHUB_RUN_ID"
          python3 - <<'PY'
          import json, os, pathlib
          rows=json.loads(pathlib.Path('reconstruction/overlay-files.json').read_text())
          paths=[row['path'] for row in rows]
          paths += ['reconstruction/overlay-files.json','Makefile.am','migration/STAGE14_IMPORT.json']
          pathlib.Path(os.environ['STAGE14_PATH_LIST']).write_bytes(b'\0'.join(p.encode() for p in paths)+b'\0')
          PY
          git add -f --pathspec-from-file="$STAGE14_PATH_LIST" --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete verified Stage 14 modular reconstruction'
          fi
          python3 migration/import_stage14.py "$archive" --root "$root" --check-only
          origin_git push origin HEAD:refs/heads/main
          existing=$(origin_git ls-remote --heads origin refs/heads/work/reconstruction)
          if test -z "$existing"; then
            origin_git push origin HEAD:refs/heads/work/reconstruction
          fi
          cat migration/STAGE14_IMPORT.json
          printf 'Imported commit: %s\n' "$(git rev-parse HEAD)"
          printf '%s\n' 'No firmware or imported executable was run. No hardware or pool was contacted.'
