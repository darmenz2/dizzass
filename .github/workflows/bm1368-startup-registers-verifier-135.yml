name: Check BM1368 startup verifier boundaries (host only)
on:
  pull_request:
    branches: [work/reconstruction]
    paths:
      - '.github/workflows/bm1368-startup-registers-verifier-135.yml'
      - 'integration/tests/test_bm1368_startup_registers_verifier_135.py'
      - '.github/workflows/bm1368-startup-registers-research.yml'
      - 'integration/bm1368-startup-registers-135.mk'
      - 'integration/bm1368_startup_registers_135.h'
      - 'integration/tests/*bm1368_startup_registers*'
      - 'libbitmain/src/chip/chip1368-startup-registers.c'
      - 'libbitmain/src/chip/chip1368-register-write.c'
      - 'libbitmain/src/reg_cache.c'
      - 'integration/bm1368_register_write_135.h'
      - 'integration/bm1368_frequency_135.h'
      - 'integration/bm1368_control.*'
      - 'include/xminer/recovery/reg_cache.h'
      - 'include/xminer/recovery/chip1398.h'
      - 'include/xminer/recovery/pll.h'
      - 'reconstruction/support/crc5.c'
      - 'reconstruction/data/reg_cache_defaults.inc'
      - 'research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-startup-registers/**'
      - 'tools/elf32.py'
      - 'reference/cgminer.vendor.elf'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original verifier and boundary controls, reference bytes only
        run: |
          python3 -B integration/tests/test_bm1368_startup_registers_verifier_135.py
          python3 -O -B integration/tests/test_bm1368_startup_registers_verifier_135.py
          python3 -O -B research/vnishnet-t21-aml-nand-1.3.5/30-reconstructed-unverified/bm1368-startup-registers/verify.py --with-reference
