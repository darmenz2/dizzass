name: Check original 1.3.5 chip temperature routes and chain stop
on:
  push:
    branches: [work/reconstruction]
    paths: &thermal_routes_paths
      - src/backend/base.c
      - src/backend/temp.c
      - src/backend/chain.c
      - libbitmain/src/aml/platform.c
      - include/xminer/recovery/aml_platform.h
      - libbitmain/src/gpio.c
      - libbitmain/src/fan_ctrl.c
      - libbitmain/src/aml/fan_ctrl.c
      - reconstruction/support/thermal*135.c
      - reconstruction/support/pid_135.c
      - integration/*135.h
      - integration/thermal-routes-135.mk
      - integration/tests/test_thermal*135*
      - integration/tests/test_aml_fans_135.py
      - integration/evidence/thermal_routes_135.json
      - .github/workflows/thermal-routes-135.yml
  pull_request:
    branches: [work/reconstruction]
    paths: *thermal_routes_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thermal-routes135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routes135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-routes135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original decoded chip replies direct readers and chain stop
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/thermal-routes-135.mk CC=${{ matrix.cc }} dizzass-routes135-original dizzass-routes135-test
      - name: Composed C thermal stop GPIO and PWM with sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/thermal-routes-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-routes135-test
      - name: Existing thermal decisions and standalone resume regression
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/thermal-sensors-135.mk CC=${{ matrix.cc }} dizzass-thermal135-original dizzass-thermal135-test dizzass-thermal135-airflow
          make -f integration/backend-resume-135.mk CC=${{ matrix.cc }} dizzass-resume135-original dizzass-resume135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -Iinclude -std=c11 -DVN135_THERMAL_ROUTES_135 -Xanalyzer -analyzer-output=text src/backend/base.c src/backend/temp.c src/backend/chain.c libbitmain/src/aml/platform.c reconstruction/support/thermal_routes_135.c
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
          printf '%s\n' 'Original bounded paths. No physical I/O, real stop worker, electrical-off proof or job-slot drain acceptance.'
