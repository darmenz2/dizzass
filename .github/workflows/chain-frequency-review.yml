name: Chain frequency source review
on:
  push:
    branches: [review/chain-frequency-135-20260926]
    paths: [.github/workflows/chain-frequency-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Archive exact baseline without executing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chain-frequency-source"
          cd "$RUNNER_TEMP/chain-frequency-source"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin 174fcc64acd17878b4fd6dfba73b33a6c2dacf42
          test "$(git rev-parse FETCH_HEAD^{tree})" = e9031d8f9b6112d2486756fb3130252d7fb426ef
          git archive --format=tar.gz --output="$RUNNER_TEMP/dizzass-chain-frequency-base.tar.gz" FETCH_HEAD
          sha256sum "$RUNNER_TEMP/dizzass-chain-frequency-base.tar.gz"
      - name: Save source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dizzass-chain-frequency-base
          path: ${{ runner.temp }}/dizzass-chain-frequency-base.tar.gz
          if-no-files-found: error
          retention-days: 1
