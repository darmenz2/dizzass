name: Check original 1.3.5 frequency-fall worker
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/frequency-worker.c
      - src/backend/base.c
      - integration/frequency_worker_135.h
      - integration/frequency-worker-135.mk
      - integration/tests/*frequency_worker*135*
      - integration/evidence/frequency_worker_135.json
      - .github/workflows/frequency-worker-135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker135:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/worker135-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original worker and nested chain decision
        run: |
          cd "$SOURCE_ROOT"
          python3 integration/tests/check_frequency_worker_evidence_135.py
          make -f integration/frequency-worker-135.mk CC=${{ matrix.cc }} dizzass-worker135-original dizzass-worker135-test dizzass-worker135-lifetime
      - name: Native memory checks and semantic negative controls
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/frequency-worker-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-worker135-test
          python3 -u integration/tests/test_frequency_worker_negative_135.py --cc ${{ matrix.cc }}
      - name: Reused handler regressions and static analysis
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/monitor-handlers-135.mk CC=${{ matrix.cc }} dizzass-handlers135-original dizzass-handlers135-test
          clang --analyze -I. -std=c11 -DVN135_FREQUENCY_WORKER_135 -Xanalyzer -analyzer-output=text src/backend/frequency-worker.c
