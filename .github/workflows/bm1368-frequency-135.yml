name: Check original 1.3.5 BM1368 frequency programming
on:
  push:
    branches: [work/reconstruction]
    paths:
      - libbitmain/src/chip/chip1368-frequency.c
      - libbitmain/src/pll.c
      - src/backend/chain-frequency.c
      - src/backend/frequency-worker.c
      - src/backend/base.c
      - integration/bm1368_control.c
      - integration/*135.h
      - integration/bm1368-frequency-135.mk
      - integration/tests/*bm1368_frequency*135*
      - integration/evidence/bm1368_frequency_135.json
      - tools/arm32*.py
      - reference/cgminer.vendor.elf
      - .github/workflows/bm1368-frequency-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm1368-frequency135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pll1368:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pll1368-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original method, existing solver, encoder and semantic negative controls
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/bm1368-frequency-135.mk CC=${{ matrix.cc }} dizzass-pll1368-original dizzass-pll1368-test dizzass-pll1368-negative
      - name: Address and undefined behavior sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/bm1368-frequency-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-pll1368-test
      - name: Previous chain, worker, dispatcher and command regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/chain-frequency-135.mk CC=${{ matrix.cc }} dizzass-chainfreq135-original dizzass-chainfreq135-test
          make -f integration/frequency-worker-135.mk CC=${{ matrix.cc }} dizzass-worker135-original dizzass-worker135-test
          make -f integration/frequency-fall-135.mk CC=${{ matrix.cc }} dizzass-fall135-original dizzass-fall135-test
          make -f integration/bm1368-control.mk CC=${{ matrix.cc }} dizzass-control-original dizzass-control-bounds
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -Iinclude -std=c11 -DVN135_BM1368_FREQUENCY_135 -Xanalyzer -analyzer-output=text libbitmain/src/chip/chip1368-frequency.c
          python3 integration/tests/check_bm1368_frequency_evidence_135.py
