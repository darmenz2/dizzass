name: Check original 1.3.5 AML fan PWM and RPM
on:
  push:
    branches: [work/reconstruction]
    paths:
      - libbitmain/src/aml/fan_ctrl.c
      - integration/aml_fans_135.h
      - integration/aml-fans-135.mk
      - integration/tests/test_aml_fans_135.*
      - integration/evidence/aml_fans_135.json
      - tools/arm32*.py
      - reference/cgminer.vendor.elf
      - .github/workflows/aml-fans-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aml-fans135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fans135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-fans135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original AML PWM RPM worker and shutdown
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/aml-fans-135.mk CC=${{ matrix.cc }} dizzass-fans135-original dizzass-fans135-test
      - name: Native state and original failures with sanitizers
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/aml-fans-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-fans135-test
      - name: Existing backend preparation and PSU regression
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/backend-prepare-135.mk CC=${{ matrix.cc }} dizzass-prepare135-original dizzass-prepare135-composed dizzass-prepare135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -Xanalyzer -analyzer-output=text libbitmain/src/aml/fan_ctrl.c
          test "$(git hash-object Makefile.am)" = 17d2fbde26b5e8cb614b61908b84d5937af48325
          test "$(git hash-object cgminer.c)" = 54739e4139294c526af0c73aa9a02ba9762ca4f2
          printf '%s\n' 'b2663b3aa753cc14ae9d3b11a14d3d93c74b605a3e433b02101c3c17c69d95e9  reference/cgminer.vendor.elf' | sha256sum -c -
          printf '%s\n' 'Original fan procedures through explicit OS/thread boundaries. No physical PWM, RPM, thermal acceptance, real threads, or slot reuse.'
