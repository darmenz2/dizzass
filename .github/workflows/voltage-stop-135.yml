name: Check original 1.3.5 voltage control stop
on:
  push:
    branches: [work/reconstruction]
    paths:
      - src/backend/base.c
      - src/backend/volt-ctrl.c
      - src/frontend/rescue.c
      - integration/*135.h
      - integration/voltage-stop-135.mk
      - integration/tests/*voltage*135*
      - integration/tests/test_exit_cleanup_135.*
      - integration/tests/test_rescue_stop_135.py
      - integration/evidence/voltage_stop_135.json
      - tools/arm32*.py
      - tools/elf32.py
      - reference/cgminer.vendor.elf
      - .github/workflows/voltage-stop-135.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltage-stop135-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voltage135:
    if: github.repository == 'darmenz2/dizzass'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Fetch exact source without persistent credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dizzass-voltage135-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cc }}"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Original stop, nested cleanup, native composition and negative controls
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/voltage-stop-135.mk CC=${{ matrix.cc }} dizzass-voltage135-original dizzass-voltage135-test dizzass-voltage135-negative
      - name: Native memory and undefined behavior
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/voltage-stop-135.mk CC=${{ matrix.cc }} SANITIZE=1 dizzass-voltage135-test
      - name: Previous rescue, pre-exit, stop policy and monitor regressions
        run: |
          cd "$SOURCE_ROOT"
          make -f integration/rescue-stop-135.mk CC=${{ matrix.cc }} dizzass-rescue135-original dizzass-rescue135-test
          make -f integration/exit-cleanup-135.mk CC=${{ matrix.cc }} dizzass-exit135-original dizzass-exit135-test
          make -f integration/stop-policy-135.mk CC=${{ matrix.cc }} dizzass-stop135-original dizzass-stop135-test
          make -f integration/general-monitor-135.mk CC=${{ matrix.cc }} dizzass-general135-original dizzass-general135-test
      - name: Static analysis and unchanged production boundary
        run: |
          cd "$SOURCE_ROOT"
          clang --analyze -I. -std=c11 -DVN135_VOLTAGE_STOP_135 -DVN135_RESCUE_STOP_135 -DVN135_BACKEND_SHUTDOWN_135 -Xanalyzer -analyzer-output=text src/backend/base.c src/backend/volt-ctrl.c src/frontend/rescue.c
          python3 integration/tests/check_voltage_stop_evidence_135.py
          printf '%s\n' 'Bounded worker stop only; no voltage adjustment, real threads, hardware acceptance or slot-limit change.'
